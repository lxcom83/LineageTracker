<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A24" media="(prefers-color-scheme: dark)">
<meta name="description" content="Lineage Tracker: free breeding records for plants and animals. Seed and stock library, tagged plants and animals, crosses, bloodlines, goals and weather, all kept on your own device.">
<title>Lineage Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --paper:#F5F2EC;--card:#FFFFFF;--sunk:#ECE7DE;--ink:#1F2B40;--muted:#5D6470;--line:#DDD5C8;
  --tag:#D9915F;--tag-ink:#1F3557;--leaf:#3F6E4E;--dam:#8E4A8A;--sire:#2B7487;--warn:#A3352A;--warn-bg:#F7E2DC;
  --navy:#1F3557;--copper:#C8794A;
  --f-tag:"Barlow Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:6px;--r-md:12px;--r-lg:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#141A24;--card:#1C2433;--sunk:#10151E;--ink:#ECE8E1;--muted:#A3A9B3;--line:#2C3546;--tag:#D99868;--leaf:#7FBF95;--dam:#C98BC5;--sire:#6CB8CB;--warn:#F2907F;--warn-bg:#3A2220;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#141A24;--card:#1C2433;--sunk:#10151E;--ink:#ECE8E1;--muted:#A3A9B3;--line:#2C3546;--tag:#D99868;--leaf:#7FBF95;--dam:#C98BC5;--sire:#6CB8CB;--warn:#F2907F;--warn-bg:#3A2220;color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
a{color:var(--leaf);text-underline-offset:2px}
img{max-width:100%}
h1,h2,h3{font-family:var(--f-tag);font-weight:600;line-height:1.08;margin:0 0 .35em;letter-spacing:.005em}
h1{font-size:2.15rem}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
p{margin:0 0 .8em}
i.sp,.sp{font-style:italic}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--sire);outline-offset:2px}
[hidden]{display:none!important}

/* Top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .flex{flex:1}
.brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand-mark{display:inline-flex;width:32px;height:32px}
.brand-mark svg{width:100%;height:100%}
.brand-name{font:700 1.3rem/1 var(--f-tag);letter-spacing:.01em}
.welcome-logo{display:block;width:min(220px,60vw);height:auto;margin:6px 0 0}
.welcome-logo svg{width:100%;height:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-mark{background:#F5F2EC;border-radius:50%;padding:3px}:root:not([data-theme="light"]) .welcome-logo{background:#F5F2EC;border-radius:24px;padding:12px}}
:root[data-theme="dark"] .brand-mark{background:#F5F2EC;border-radius:50%;padding:3px}
:root[data-theme="dark"] .welcome-logo{background:#F5F2EC;border-radius:24px;padding:12px}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:22px;height:22px}

main{max-width:760px;margin:0 auto;padding:16px 16px 24px}

/* The tag: plant stake and ear tag in one. The app's one loud element. */
.tag{display:inline-flex;align-items:center;gap:.42em;background:var(--tag);color:var(--tag-ink);font:700 1.05rem/1 var(--f-tag);letter-spacing:.03em;padding:.34em .78em .34em .5em;border-radius:.3em 1em 1em .3em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag::before{content:"";flex:none;width:.46em;height:.46em;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.tag.sm{font-size:.85rem}
.tag.xl{font-size:clamp(2.2rem,11vw,3.2rem);padding:.2em .62em .2em .38em}
.tag.xl.long{font-size:clamp(1.5rem,7.4vw,2.6rem)}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;max-width:760px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:4px 6px calc(6px + env(safe-area-inset-bottom,0px))}
@media(min-width:780px){.tabs{border:1px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0}}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 2px;font-size:.74rem;color:var(--muted);text-decoration:none;border-radius:var(--r-sm)}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs .cap{justify-self:center;width:64px;height:64px;margin-top:-28px;border-radius:50%;display:grid;place-items:center;background:var(--tag);color:var(--tag-ink);border:4px solid var(--paper);box-shadow:0 8px 18px -8px rgba(0,0,0,.45);cursor:pointer;padding:0}
.tabs .cap svg{width:30px;height:30px}

/* Buttons and chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 .95rem/1.1 var(--f-body);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.tagc{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.btn.danger{color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.actions.tight{margin:0}
.linkish{border:0;background:none;padding:0 2px;color:var(--muted);font:inherit;font-size:.82rem;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem;line-height:1.5;color:var(--muted);background:transparent;text-decoration:none;white-space:nowrap}
.chip.warn{border-color:transparent;background:var(--warn-bg);color:var(--warn)}
.chip.ok{color:var(--leaf);border-color:color-mix(in srgb,var(--leaf) 45%,transparent)}
a.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}

/* Sections */
.sec{margin:30px 0 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.sec-head h2{margin:0}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.page-head h1{margin:0}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:var(--r-lg);text-align:center;color:var(--muted)}
.empty .btn{margin-top:4px}
.notice{border-radius:var(--r-md);padding:10px 14px;margin:0 0 12px;font-size:.93rem;background:var(--sunk)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.prose{max-width:62ch;white-space:pre-wrap}
.goal{font-size:1.08rem;max-width:58ch;white-space:pre-wrap}

/* Home */
.today{margin:0 0 10px;color:var(--muted)}
.capture-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.cap-btn{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:100px;padding:14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.cap-btn svg{width:26px;height:26px}
.cap-btn b{display:block;font:600 1.3rem/1.05 var(--f-tag)}
.cap-btn small{display:block;margin-top:4px;font-size:.85rem;opacity:.8}
.cap-btn.big{grid-row:span 2;background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.cap-btn.big b{font-size:1.75rem}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.pcard{flex:0 0 230px;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none}
.pcard .tag{align-self:flex-start}
.pcard .n{font:600 1.35rem/1.05 var(--f-tag)}
.pcard .tag{align-self:flex-start}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.9rem;color:var(--muted);margin:0}
.ask-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);color:inherit;text-decoration:none}
.ask-card svg{width:28px;height:28px;flex:none;color:var(--leaf)}
.ask-card b{display:block}
.ask-card small{color:var(--muted)}
.welcome{padding:8px 0 4px}
.welcome h1{font-size:2.6rem;margin:14px 0 2px;max-width:16ch}
.welcome .lede{font:600 1.25rem/1.2 var(--f-tag);color:var(--copper);margin:0 0 10px}
.welcome p{max-width:52ch}

/* Lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:var(--r-md);color:inherit;text-decoration:none}
.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:.87rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tag{align-self:flex-start}
.row .nm{font-weight:700}
.thumb{flex:none;width:54px;height:54px;border-radius:var(--r-sm);object-fit:cover;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.thumb svg{width:24px;height:24px}
.grp{margin:0 0 14px}
.grp h3{color:var(--muted);font-size:1.05rem;margin:14px 8px 4px}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.meter{display:block;width:56px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf)}

/* Search and segmented control */
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;margin:0 0 4px}
.seg a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem}
.seg a[aria-current="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.searchbar{position:relative;margin:10px 0}
.searchbar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.searchbar input{padding-left:40px}

/* Detail pages */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:4px 0 6px}
.hero h1{margin:0}
.hero .sub{color:var(--muted);margin:0}
.nick{font:600 1.35rem/1.1 var(--f-tag);margin:2px 0 0}
.cover{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:var(--r-lg);background:var(--sunk);margin:0 0 14px;cursor:zoom-in}
.empty-cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:150px;border:1.5px dashed var(--line);color:var(--muted);font:inherit;cursor:pointer}
.empty-cover svg{width:30px;height:30px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px;margin:14px 0}
.facts div{display:flex;flex-direction:column;min-width:0}
.facts dt{font-size:.8rem;color:var(--muted)}
.facts dd{margin:0;font-weight:700;overflow-wrap:anywhere}

/* Log timeline */
.log{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--line)}
.log li{position:relative;padding:0 0 20px 18px}
.log li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--leaf)}
.log .d{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.84rem;color:var(--muted)}
.log .txt{white-space:pre-wrap;margin:4px 0 0;max-width:62ch}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:8px}
.ph-grid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-sm);background:var(--sunk);cursor:zoom-in}

/* Pedigree */
.ped-wrap{overflow-x:auto;padding:4px 2px 10px}
.ped{display:flex;align-items:center}
.ped-par{display:flex;flex-direction:column;gap:8px;margin-left:16px;padding-left:16px;border-left:2px solid var(--line)}
.ped-side{position:relative}
.ped-side::before{content:"";position:absolute;left:-16px;top:50%;width:14px;border-top:2px solid var(--line)}
.ped-node{flex:none;display:block;min-width:118px;max-width:170px;padding:6px 10px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line);font-size:.82rem;color:inherit;text-decoration:none}
.ped-node .c{display:block;font:700 1.02rem/1.1 var(--f-tag);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped-node .r{color:var(--muted)}
.ped-node.unknown{color:var(--muted);border-style:dashed}
.ped-side.dam>.ped>.ped-node{border-left:4px solid var(--dam)}
.ped-side.sire>.ped>.ped-node{border-left:4px solid var(--sire)}
.ped-key{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin:0 0 6px}
.ped-key span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ped-key .k-dam::before{background:var(--dam)}
.ped-key .k-sire::before{background:var(--sire)}

/* Scores */
.tier-h{font-size:1rem;color:var(--muted);margin:14px 0 2px}
.trait{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.pips{display:flex;gap:4px}
.pips button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:700 .88rem var(--f-body);cursor:pointer}
.pips button.on{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.rank{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-md);text-decoration:none;color:inherit}
.rank:hover{background:var(--sunk)}
.rank .main{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}

/* Projects */
.proj{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);margin:0 0 12px;overflow:hidden}
.proj-main{display:block;padding:16px;color:inherit;text-decoration:none}
.proj-main h2{margin:0 0 2px}
.proj-main p{margin:0 0 6px}
.lines{list-style:none;margin:0;padding:8px 16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.lines a{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:700}

/* Sheets (forms) */
.sheet-wrap{position:fixed;inset:0;z-index:20}
.sheet-back{position:absolute;inset:0;background:rgba(8,14,16,.5);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--paper);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.open .sheet-back{opacity:1}
.sheet-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 8px;background:var(--paper)}
.sheet-head h2{margin:0}
@media(min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:5vh;width:min(640px,94vw);max-height:90vh;border-radius:var(--r-lg);transform:translate(-50%,16px);opacity:0;transition:transform .2s,opacity .2s}
  .sheet-wrap.open .sheet{transform:translate(-50%,0);opacity:1}
}
.sheet-actions{position:sticky;bottom:0;background:var(--paper);padding:10px 0 4px;margin-bottom:0}
.cap-list{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.cap-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.cap-item svg{width:26px;height:26px;flex:none}
.cap-item b{display:block}
.cap-item small{color:var(--muted)}
.cap-item:first-child{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.cap-item:first-child small{color:inherit;opacity:.8}

/* Form fields */
.fld{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;min-width:0}
.fld>span{font-size:.86rem;font-weight:700}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:90px}
input[type="search"]{-webkit-appearance:none;appearance:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chk{display:flex;align-items:center;gap:10px;margin:0 0 12px;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--leaf)}
.hint{font-size:.86rem;color:var(--muted);margin:-4px 0 12px}
.ph-t{position:relative}
.ph-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.ph-x svg{width:16px;height:16px}
.pickbox{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--card);margin:0 0 12px}
.pickbox .chk{margin:0;padding:5px 0}
.tr-row{display:grid;grid-template-columns:1fr 92px auto 36px;gap:6px;align-items:center;margin:0 0 6px}
.tr-row .chk{margin:0;font-size:.85rem}
.radios{border:0;padding:0;margin:0 0 8px;display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);cursor:pointer}
.radio input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none;accent-color:var(--leaf)}
.radio small{display:block;color:var(--muted)}
.manual{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin:0 0 14px;background:var(--card)}
.manual ol{margin:6px 0 10px;padding-left:20px}
.manual textarea{margin:10px 0}
.answer{margin-top:16px;max-width:62ch}
.answer:empty{display:none}


/* Records, record types and comparison */
.btn.sm{min-height:36px;padding:0 12px;font-size:.86rem;border-radius:10px}
.btn.sm svg{width:16px;height:16px}
.rt-block{margin:0 0 18px}
.rt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.rt-head h3{margin:0}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:10px 12px}
.item-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.item-head .linkish{margin-left:auto}
.vals{margin:4px 0 0;font-size:.92rem}
.trial{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.92rem}
.trial>div{flex-basis:100%}
.rt-def{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 8px;border-bottom:1px solid var(--line)}
.rt-def .main{flex:1;min-width:200px;display:flex;flex-direction:column}
.rt-def .t{font-weight:700}
.rt-def .s{font-size:.87rem;color:var(--muted)}
.fd{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:8px;margin:0 0 8px}
.fd-top{display:grid;grid-template-columns:1fr 130px 40px;gap:6px;align-items:center}
.fd-more{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fd-more input,.fd-more select{flex:1 1 160px}
.fd-more .chk{margin:0;flex:1 1 160px;font-size:.88rem}
.fd-more .chk input{flex:none}
.fd-more .fd-agg{flex:1 1 220px}
.pip{position:relative;display:inline-grid}
.pip input{position:absolute;opacity:0;width:100%;height:100%;margin:0;min-height:0;cursor:pointer}
.pip span{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted);font-weight:700}
.pip input:checked+span{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.pip input:focus-visible+span{outline:3px solid var(--sire);outline-offset:2px}
.pips .linkish{align-self:center;width:auto;height:auto;margin-left:6px;border:0;border-radius:0;background:none}
output.calc{display:block;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunk);font-weight:700}
output.calc.empty{font-weight:400;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
table.cmp{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.cmp thead th{font-size:.8rem;vertical-align:bottom;white-space:normal;min-width:84px}
table.cmp thead th a{color:var(--muted);text-decoration:none}
table.cmp thead th a[aria-sort]{color:var(--ink)}
table.cmp tbody th,table.cmp thead th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
table.cmp tbody th a{font-weight:700;color:var(--ink)}
table.cmp td.flag{color:var(--warn);font-weight:700}
table.cmp tbody tr:last-child>*{border-bottom:0}
.bulk-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.bulk-row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.bulk-row .t{font-weight:700}
.bulk-row .s{font-size:.85rem;color:var(--muted)}
.bulk-row select{width:auto;flex:0 0 46%}
.cap-item.plain{background:var(--card)!important;border-color:var(--line)!important;color:var(--ink)!important}
.cap-item.plain small{color:var(--muted)!important;opacity:1!important}
.cap-item[disabled]{opacity:.55;cursor:default}
details summary{cursor:pointer}


/* v0.3: main photos, framing, due list, places, chart */
.cover-wrap{position:relative;margin:0 0 14px}
.cover-wrap .cover{margin:0}
.cover-btn{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:0;border-radius:999px;background:rgba(15,22,26,.72);color:#fff;font:700 .85rem var(--f-body);cursor:pointer;backdrop-filter:blur(4px)}
.cover-btn svg{width:16px;height:16px}
.pick-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.pick{padding:0;border:3px solid transparent;border-radius:var(--r-md);background:none;cursor:pointer;overflow:hidden}
.pick img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pick.on{border-color:var(--tag)}
.framer{position:relative;width:min(320px,82vw);aspect-ratio:1;margin:8px auto 4px;overflow:hidden;border-radius:var(--r-md);background:#000;touch-action:none;cursor:grab;user-select:none}
.framer img{position:absolute;max-width:none;pointer-events:none}
.framer-ring{position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9);border-radius:var(--r-md);pointer-events:none}
.frame-prev{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 4px}
.frame-prev canvas{width:72px;height:72px;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.lb-bar{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:46%}
.row.as-btn{width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer}
.pcard-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r-md);background:var(--sunk);margin-bottom:6px}
.due{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.due-row{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.due-row.late{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));box-shadow:inset 4px 0 0 var(--warn)}
.due-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 4px 10px 12px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.due-main svg{width:22px;height:22px;flex:none;color:var(--leaf)}
.due-row.late .due-main svg{color:var(--warn)}
.due-main .main{display:flex;flex-direction:column;min-width:0}
.due-main .t{font-weight:700}
.due-main .s{font-size:.86rem;color:var(--muted)}
body.tree-page main{max-width:none}
.tree-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
.tree-head h1{margin:0}
.tree-wrap{position:relative;height:calc(100dvh - 330px);min-height:380px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);overflow:hidden;touch-action:none;cursor:grab}
.tree-wrap svg{display:block}
.tree-wrap .tn{cursor:pointer}
.tree-ctrl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.tree-ctrl .icon-btn{background:var(--card);border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tree-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 6px;font-size:.85rem;color:var(--muted)}
.tree-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tree-card{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:10px 12px;margin:8px 0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.tree-card .main{flex:1;min-width:160px;display:flex;flex-direction:column}

/* Modes, check, plan, labels, sessions */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 0}
.quick-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);color:var(--ink);text-decoration:none}
.quick-btn svg{width:26px;height:26px;flex:none;color:var(--copper)}
.quick-btn b{display:block;font:600 1.15rem/1.1 var(--f-tag)}
.quick-btn small{color:var(--muted)}
.setup-choice{padding:16px}.setup-choice b{font-size:1.1rem}
.searchbar.big input{min-height:56px;font-size:1.2rem}
.check-result{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:12px 14px;margin:0 0 10px}
.check-result.have{border-left-color:var(--leaf)}.check-result.had{border-left-color:var(--tag)}.check-result.none{border-left-color:var(--sire)}
.check-result p{margin:4px 0}.check-result ul{margin:4px 0 6px;padding-left:18px}
.guide{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:12px 14px;margin:8px 0 12px}
.plan-checks{margin:8px 0 12px}
details.more{margin:4px 0 12px;border-top:1px solid var(--line);padding-top:8px}
details.more>summary{cursor:pointer;color:var(--muted);font-weight:700;margin-bottom:10px}
.feat-list{display:flex;flex-direction:column;gap:6px}
.feat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.feat span{display:flex;flex-direction:column;min-width:0}.feat small{color:var(--muted)}
.feat select{width:auto;flex:none;max-width:48%}
.sticky-actions{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--paper);padding:8px 0}
.session-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--paper);padding:8px 0}
.session-nav .btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.session-card .pips button{width:44px;height:44px;font-size:1rem}

body.setup-page .tabs,body.setup-page #logBtn,body.setup-page #setBtn,body.setup-page #syncBtn{display:none!important}
body.setup-page{padding-bottom:24px}

/* Workspaces */
.ws-banner{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--sunk);border:1px solid var(--line);border-left:5px solid var(--copper);border-radius:var(--r-md);padding:10px 12px;margin:0 0 14px}
.ws-banner small{display:block;color:var(--muted);margin-top:2px}

/* My garden / My farm */
#farmBtn.on{color:var(--copper)}
.fgroup{margin:18px 0 0}.fgroup h2{font-size:1.35rem;margin:0 0 8px}
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ftile{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.ftile-main{flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--ink);text-decoration:none;min-width:0}
.ftile-main svg{width:26px;height:26px;flex:none;color:var(--copper)}
.ftile-main b{display:block;font:600 1.12rem/1.15 var(--f-tag)}
.ftile-main small{display:block;color:var(--muted);font-size:.86rem}
.ftile-add{flex:none;width:54px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.ftile-add svg{width:22px;height:22px}

@media (max-width:400px){.brand-name{font-size:1.15rem}}

/* AI waiting, choices and share shape */
.ai-wait{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sunk);border-radius:var(--r-md);padding:12px 14px;margin:10px 0}
.ai-wait .btn{margin-left:auto}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--copper);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
.modal-wrap{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{background:var(--card);color:var(--ink);border-radius:var(--r-lg);padding:18px;max-width:520px;width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.modal h2{margin:0 0 8px;font-size:1.4rem}
.modal-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.share-shape{margin:0 0 10px}

/* Partner versions */
.brand.has-powered{display:inline-grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:8px;row-gap:1px;align-items:center}
.brand.has-powered .brand-mark{grid-row:1/3}
.brand-powered{grid-column:2;font:600 .62rem/1 var(--f-body);color:var(--muted);letter-spacing:.02em}

/* Help and feedback */
.wn{margin:6px 0 10px;padding-left:20px}.wn li{margin:4px 0}
.err-bar{position:fixed;left:10px;right:10px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:var(--r-md);padding:10px 12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}

/* Inputs */
.ph-row{display:flex;flex-wrap:wrap;gap:8px}.ph-big{width:min(100%,260px);border-radius:var(--r-md);border:1px solid var(--line)}

/* Seed trays */
.tray-grid{display:grid;gap:6px;margin:10px 0 14px}
.tray-grid .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;padding:4px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.tray-grid .cell b{font:700 1.1rem/1 var(--f-tag)}.tray-grid .cell small{font-size:.7rem;color:var(--muted);text-align:center;line-height:1.1}
.tray-grid .cell.up{background:color-mix(in srgb,var(--leaf) 22%,var(--card));border-color:var(--leaf)}
.tray-grid .cell.failed{background:var(--sunk);border-style:dashed;color:var(--muted)}
.tray-grid .cell.potted{background:color-mix(in srgb,var(--tag) 30%,var(--card));border-color:var(--tag);cursor:default}
.tray-grid .cell.culled{opacity:.5}

/* Share */
.share-prev{display:block;width:min(100%,360px);margin:0 auto 12px;border-radius:var(--r-md);border:1px solid var(--line)}

/* Import */
.imp-map{list-style:none;padding:4px 0 8px}
.imp-warn{margin:6px 0 0;padding-left:18px;max-height:240px;overflow:auto}
.bulk-row select{max-width:60%}

/* Weather */
.wx-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 6px}
.wx-cards>div{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.wx-cards .k{font-size:.8rem;color:var(--muted)}
.wx-cards b{font:600 1.5rem/1 var(--f-tag)}
.wx-cards .chip{align-self:flex-start}
table.cmp tr.norm th,table.cmp tr.norm td{color:var(--muted);font-style:italic}

/* Goals */
.goal-card{border:1px solid var(--line);border-left:5px solid var(--tag);border-radius:var(--r-md);background:var(--card);padding:12px 14px;margin:6px 0 4px}
.goal-card.empty{border-left-color:var(--line)}
.goal-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.goal-card .goal{margin:0 0 6px}
.goal-dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px;margin:8px 0 0}
.goal-dl dt{font-size:.8rem;color:var(--muted)}
.goal-dl dd{margin:0;white-space:pre-wrap}
.goal-hist{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.goal-hist li{position:relative;padding:0 0 22px 18px}
.goal-hist li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--tag)}

/* Sync button */
#syncBtn.sync-ok{color:var(--leaf)}
#syncBtn.sync-syncing{color:var(--muted);animation:pulse 1.2s ease-in-out infinite}
#syncBtn.sync-auth,#syncBtn.sync-error{color:var(--warn)}
#syncBtn.sync-offline{color:var(--muted)}
@keyframes pulse{50%{opacity:.35}}

/* Lightbox, toast, busy */
.lb{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.92);cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:90vw;padding:10px 18px;border-radius:22px;text-align:center;background:var(--ink);color:var(--paper);font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
body.busy::after{content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:50;background:linear-gradient(90deg,transparent,var(--tag),transparent);background-size:50% 100%;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-50% 0}to{background-position:150% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media (max-width:380px){.two{grid-template-columns:1fr}.capture-grid{grid-template-columns:1fr}.cap-btn.big{grid-row:auto}}
</style>
</head>

/* ---------- Due list ---------- */
function dueItems() {
  const items = [], t = today(), st = S.dueState || {}, set = S.settings;
  const add = it => { const s = st[it.key]; if (s?.until && s.until > t) return; if (s?.skip && s.skip === it.date) return; it.days = daysBetween(t, it.date); items.push(it); };
  // Fruit set checks after hand pollination
  if (on('crosses')) for (const c of all('cross')) if (c.method === 'Hand-pollinated' && c.status === 'Done' && c.date)
    add({ key: 'fs:' + c.id, date: addDays(c.date, +set.fruitSetDays || 10), icon: 'cross', title: `Check fruit set: ${crossTitle(c)}`, sub: `Hand-pollinated ${fmtDate(c.date)}. Mark the cross Successful or Failed.`, go: { act: 'editCross', id: c.id } });
  // Storage and other trial checks
  for (const { rt: c, project } of rtIndex().values()) {
    if (!on('records') || !c.parentRt || c.archived || !endFieldOf(c)) continue;
    const parentRt = rtInfo(c.parentRt).rt; if (!parentRt) continue;
    const every = +set.storageDays || 30;
    const due = [];
    for (const e of all('entry')) {
      if (e.rtId !== parentRt.id || e.parentEntryId) continue;
      const ind = get(e.indId); if (!ind) continue;
      const tr = trialOf(e, c); if (tr?.ended) continue;
      due.push(addDays(tr ? tr.last.date : e.date, every));
    }
    if (!due.length) continue;
    due.sort();
    const first = due[0], horizon = first > t ? addDays(first, 7) : t;
    const n = due.filter(d => d <= horizon).length;
    add({ key: `st:${c.id}`, date: first, icon: 'library', title: `${n} ${(parentRt.itemName || 'item').toLowerCase()}${n === 1 ? '' : 's'} due a ${c.name.toLowerCase()}`, sub: `${project.name}. Opens the form to check them all at once.`, go: { act: 'bulk', project: project.id, rt: c.id } });
  }
  // Germination: tests to finish, lots to test, lots to regrow, low stock
  const retest = (+set.germRetestMonths || 12) * 30.4;
  const toTest = [], low = [];
  for (const l of all('stock')) {
    if (l.status === 'used') continue;
    if (l.qty != null && l.qty !== '' && l.minQty != null && l.minQty !== '' && +l.qty < +l.minQty && formOf(l) !== 'seed') low.push(l);
    if (formOf(l) !== 'seed') continue;

/* ---------- Automatic cross codes ---------- */
function crossCodeFor(date, fmt = S.settings.crossFormat || '{YY}C-{N}', exceptId) {
  const y = (date || today()).slice(0, 4);
  const used = new Set(all('cross').filter(c => c.id !== exceptId).map(c => String(c.code || '').toUpperCase()));
  for (let n = 1; n < 100000; n++) { const code = fmt.replace(/\{YYYY\}/gi, y).replace(/\{YY\}/gi, y.slice(2)).replace(/\{N\}/gi, n); if (!used.has(code.toUpperCase())) return code; }
  return '';
}
async function codeOldCrosses() {

  for (const c of list) { c.code = crossCodeFor(c.date); await save(c); }
  toast(`${list.length} cross${list.length === 1 ? '' : 'es'} given codes`); render();
}

      <div class="two"><label class="fld"><span>Daily high (if separate)</span><select name="cHi">${opt(cHi)}</select></label><label class="fld"><span>Daily low (if separate)</span><select name="cLo">${opt(cLo)}</select></label></div>
      <div class="two"><label class="fld"><span>Rain</span><select name="cR">${opt(cR)}</select></label><label class="fld"><span>Rain unit</span><select name="uR"><option value="auto" ${unitR === 'auto' ? 'selected' : ''}>Work it out</option><option value="mm" ${unitR === 'mm' ? 'selected' : ''}>mm</option><option value="in" ${unitR === 'in' ? 'selected' : ''}>inches</option></select></label></div>
      ${F.select('mode', 'The rain column is', mode, [['total', 'A running total for the day (take the day\'s highest)'], ['interval', 'The rain in each row (add them up)']])}

    };
    const upd = () => { const days = calc(); $('#stPrev', el).innerHTML = days.length ? `<p class="small"><b>${days.length} days</b>, ${h(fmtDate(days[0].date))} to ${h(fmtDate(days[days.length - 1].date))}.</p><div class="tbl-wrap"><table class="cmp"><thead><tr><th>Day</th><th>Rain (${rU()})</th><th>High (${tU()})</th><th>Low (${tU()})</th></tr></thead><tbody>${days.slice(-5).map(d => `<tr><th scope="row">${h(fmtDate(d.date))}</th><td>${d.rain != null ? fmtRn(d.rain) : ''}</td><td>${d.tmax != null ? fmtT(d.tmax) : ''}</td><td>${d.tmin != null ? fmtT(d.tmin) : ''}</td></tr>`).join('')}</tbody></table></div><p class="hint">The last five days, as they'll be saved.</p>` : '<p class="notice warn">No days found with these columns.</p>'; };

/* ---------- Encryption for synced data (AES-GCM, key from a passphrase) ---------- */
const b64e = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(saltB64), iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

async function encBytes(key, bytes) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes); const out = new Uint8Array(12 + ct.byteLength); out.set(iv); out.set(new Uint8Array(ct), 12); return out; }

async function openJSON(wrapper) { return JSON.parse(new TextDecoder().decode(await decBytes(SYNC.key, b64d(wrapper.data)))); }
const lockedErr = msg => Object.assign(new Error(msg || 'Enter your sync passphrase to keep syncing'), { locked: true });
async function loadSyncKey() { const k = await DB.mainGet('meta', 'syncKey'); if (k?.k && k.salt) { SYNC.key = k.k; SYNC.keySalt = k.salt; } }
async function setSyncKey(pass, salt) { const key = await deriveSyncKey(pass, salt); SYNC.key = key; SYNC.keySalt = salt; await DB.mainPut('meta', { key: 'syncKey', k: key, salt }); }
function passphraseSheet(mode) {
  const { el, form } = formSheet(mode === 'unlock' ? 'Enter sync passphrase' : 'Protect synced data', `
    ${mode === 'unlock' ? '<p class="muted" style="margin-top:0">Another of your devices protected your synced records with a passphrase. Enter it once on this device to keep syncing.</p>' : `<p class="muted" style="margin-top:0">Your records and photos are encrypted on this device before they go to Google Drive, so only devices with the passphrase can read them.</p><div class="notice warn">If you forget the passphrase, the copy in Drive can't be read by anyone, including you. Your records on each device are unaffected, and you can start sync again from any device.</div>`}
    <label class="fld"><span>Passphrase</span><input type="password" name="p1" autocomplete="new-password"></label>
    ${mode === 'unlock' ? '' : '<label class="fld"><span>Type it again</span><input type="password" name="p2" autocomplete="new-password"></label><p class="hint">At least 10 characters. A few unrelated words works well.</p>'}`, {
    saveLabel: mode === 'unlock' ? 'Unlock' : 'Protect',
    onSave: async d => {
      if (mode === 'unlock') {
        await setSyncKey(d.p1, S.sync.salt);
        closeSheet(); toast('Checking…'); await syncNow({ interactive: true });
        if (SYNC.state === 'locked') toast('That passphrase didn\'t match');
        render(); return;
      }
      if ((d.p1 || '').length < 10) throw new Error('Use at least 10 characters');
      if (d.p1 !== d.p2) throw new Error('The two passphrases don\'t match');
      const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
      S.sync.salt = salt; await setSyncKey(d.p1, salt);
      S.sync.encrypt = true; S.sync.encAt = Date.now(); S.sync.reseal = true; await saveSync();
      closeSheet(); toast('Protecting your synced data…'); await syncNow({ interactive: true }); render();
    },

}
async function syncUnprotect() {
  if (!confirm('Turn off passphrase protection? Your synced records and photos will be stored in your Google Drive unencrypted again.')) return;
  S.sync.encrypt = false; S.sync.encAt = Date.now(); S.sync.reseal = true; await saveSync();
  await syncNow({ interactive: true }); render();
}

}
/* Add a new bed, pot or pen without leaving a form */
function attachNewPlace(select) {
  if (!select || select.dataset.newPlace) return; select.dataset.newPlace = '1';
  const opt = document.createElement('option'); opt.value = '__new'; opt.textContent = keepsKind('animal') && !keepsKind('plant') ? '+ New coop, pen or paddock…' : '+ New bed, pot or greenhouse…'; select.appendChild(opt);
  let prev = select.value === '__new' ? '' : select.value;
  select.addEventListener('focus', () => { prev = select.value; });
  select.addEventListener('change', async () => {
    if (select.value !== '__new') { prev = select.value; return; }
    const name = (prompt('Name the new place, for example "Pot 3 (20 cm)" or "Bed 2"') || '').trim();
    if (!name) { select.value = prev; return; }
    const pl = { id: uid(), type: 'place', name, kind: keepsKind('animal') && !keepsKind('plant') ? 'animal' : 'plant', method: '', notes: '' };
    await save(pl);
    const o = document.createElement('option'); o.value = pl.id; o.textContent = name; select.insertBefore(o, opt); select.value = pl.id; prev = pl.id;
    select.dispatchEvent(new Event('input', { bubbles: true }));
    toast(`${name} added`);
  });
}
function moveSheet(id) {

function pLibrary(_, q) {

      : emptyBox('Places are where things grow or live: garden beds, raised beds, pots, coops, pens. Give each plant or animal a place to compare how methods perform.', 'newPlace', 'Add a place');
  } else {

    if (q.due === 'low') { items = items.filter(l => l.qty != null && l.qty !== '' && l.minQty != null && l.minQty !== '' && +l.qty < +l.minQty); note = 'Lots below the amount you set to keep.'; }

function pLot(id) {

  <dl class="facts">${s && !l.label ? factLink('Variety or breed', s) : ''}${formOf(l) !== 'seed' ? fact('What it is', FORMS[formOf(l)].label) : ''}${factLink('Clone of', get(l.cloneOf))}${l.propMethod ? fact('Method', l.propMethod) : ''}${fact('Source', l.source)}${fact('Batch', l.batch)}${fact('Packed, harvested or bought', l.year)}${fact('Best before', fmtDate(l.bestBefore))}${fact('Quantity', qtyText(l))}${l.minQty != null && l.minQty !== '' ? fact('Keep at least', `${fmtNum(l.minQty)}${l.unit ? ' ' + l.unit : ''}`) : ''}${fact('Stored', l.location)}${fact('Status', LOT_STATUS[l.status])}${on('projects') ? factLink('Project', p) : ''}${on('saving') ? factLink('From cross', c) + factLink('Mother', m) + factLink('Father', f) : ''}</dl>

function pedNode(r, side) {
  if (!r) return `<span class="ped-node unknown"><span class="c">Unknown</span><span class="r">${side}</span></span>`;
  const sub = r.type === 'individual' ? [get(r.strainId)?.name, r.generation].filter(Boolean).join(', ') : r.type === 'strain' ? 'Founder variety or breed' : 'Lot';
  return `<a class="ped-node" href="${link(r)}"><span class="c">${h(shortName(r))}</span><span class="r">${h(sub)}</span></a>`;
}
function pedTree(r, depth = 0, side = '') {
  const [m, f] = parentsOf(r);
  if (depth >= 3 || (!m && !f)) return `<div class="ped">${pedNode(r, side)}</div>`;
  return `<div class="ped">${pedNode(r, side)}<div class="ped-par"><div class="ped-side dam">${m ? pedTree(m, depth + 1, 'Mother') : `<div class="ped">${pedNode(null, 'Mother')}</div>`}</div><div class="ped-side sire">${f ? pedTree(f, depth + 1, 'Father') : `<div class="ped">${pedNode(null, 'Father')}</div>`}</div></div></div>`;
}

function scoresHTML(i, traits, p) {
  if (!traits.length) return p ? sec('Selection scores', null, `<p class="muted">Add target traits to <a href="#/project/${p.id}">${h(p.name)}</a> to score this ${h(W(i).ind)} against them.</p>`) : '';
  const sc = scoreOf(i, traits);
  const tiers = [1, 2, 3, 4].filter(t => traits.some(x => +x.tier === t));
  const gf = goalFor(p);
  const body = `${gf ? `<p class="small" style="margin:0 0 6px">Scoring against <a href="#/project/${gf.p.id}">${h(gf.p.name)}</a> <span class="tag sm">${h(goalTag(gf))}</span></p>` : ''}<p class="hint" style="margin-top:0">Tap 1 (poor) to 5 (excellent). Tier 1 traits count most. Tap a score again to clear it.</p>
    ${sc.flags.length ? `<div class="notice warn">Below 3 on a must-have trait: ${sc.flags.map(h).join(', ')}</div>` : ''}
    ${tiers.map(t => `<h3 class="tier-h">Tier ${t}</h3>${traits.filter(x => +x.tier === t).map(x => {
      const v = i.scores?.[x.name];
      return `<div class="trait"><span>${h(x.name)}${x.must ? ' <span class="chip">Must-have</span>' : ''}</span><span class="pips" role="group" aria-label="${h(x.name)}">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="${v >= n ? 'on' : ''}" data-act="score" data-id="${i.id}" data-trait="${h(x.name)}" data-v="${n}" aria-pressed="${v === n}">${n}</button>`).join('')}</span></div>`;
    }).join('')}`).join('')}`;
  return `<section class="sec"><div class="sec-head"><h2>Selection scores</h2>${scoreBadge(sc.pct)}</div>${body}</section>`;
}

function pCross(id) {

  const inds = all('individual').filter(i => i.crossId === id).sort(byCode);
  const notes = notesFor(id);
  const year = (c.date || today()).slice(0, 4);
  const gen = suggestGen(m, f);
  return `<div class="hero"><h1>${h(crossTitle(c))}</h1><p class="sub">${[fmtDate(c.date), c.method, c.status].filter(Boolean).map(h).join(', ')}</p></div>

/* ---------- Sheets and form fields ---------- */
function sheet(titleText, body) {
  closeSheet();
  const el = document.createElement('div');
  el.className = 'sheet-wrap';
  el.innerHTML = `<div class="sheet-back" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${h(titleText)}"><header class="sheet-head"><h2>${h(titleText)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ic('x')}</button></header><div class="sheet-body">${body}</div></section>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
  requestAnimationFrame(() => el.classList.add('open'));
  hydrate(el);
  setTimeout(() => $('input:not([type=hidden]),select,textarea', el)?.focus({ preventScroll: true }), 260);
  return el;
}
function closeSheet() { $$('.sheet-wrap').forEach(e => e.remove()); }

const F = {
  text: (k, label, v, ph = '') => `<label class="fld"><span>${label}</span><input name="${k}" value="${h(v)}" placeholder="${h(ph)}"></label>`,
  area: (k, label, v, ph = '', rows = 3) => `<label class="fld"><span>${label}</span><textarea name="${k}" rows="${rows}" placeholder="${h(ph)}">${h(v)}</textarea></label>`,
  date: (k, label, v) => `<label class="fld"><span>${label}</span><input type="date" name="${k}" value="${h(v)}"></label>`,
  month: (k, label, v) => `<label class="fld"><span>${label}</span><input type="month" name="${k}" value="${h((v || '').slice(0, 7))}" placeholder="YYYY-MM"></label>`,
  select: (k, label, v, opts) => `<label class="fld"><span>${label}</span><select name="${k}">${opts.map(o => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${h(val)}" ${val === (v ?? '') ? 'selected' : ''}>${h(txt)}</option>`; }).join('')}</select></label>`,
  check: (k, label, v) => `<label class="chk"><input type="checkbox" name="${k}" ${v ? 'checked' : ''}><span>${label}</span></label>`,
  ref: (k, label, v, groups, none = 'Unknown or none') => `<label class="fld"><span>${label}</span><select name="${k}"><option value="">${h(none)}</option>${groups.filter(g => g.items.length).map(g => `<optgroup label="${h(g.label)}">${g.items.map(([id, t]) => `<option value="${id}" ${id === v ? 'selected' : ''}>${h(t)}</option>`).join('')}</optgroup>`).join('')}</select></label>`,
};
const indItems = (exclude) => all('individual').filter(r => r.id !== exclude).sort(byCode).map(r => [r.id, r.code + (r.name ? ` (${r.name})` : '')]);
const strainItems = () => all('strain').sort(byName).map(r => [r.id, r.name]);
const projectItems = (exclude) => all('project').filter(r => r.id !== exclude).sort(byName).map(r => [r.id, (get(r.parentId) ? get(r.parentId).name + ': ' : '') + r.name]);
const lotItems = () => all('stock').sort((a, b) => title(a).localeCompare(title(b))).map(r => [r.id, title(r) + (r.batch ? ` (${r.batch})` : '')]);
const parentGroups = exclude => [{ label: 'Tagged plants and animals', items: indItems(exclude) }, { label: 'Varieties and breeds', items: strainItems() }];
const anyGroups = () => [{ label: 'Tagged plants and animals', items: indItems() }, { label: 'Varieties and breeds', items: strainItems() }, { label: 'Projects', items: projectItems() }, { label: 'Lots', items: lotItems() }, { label: 'Crosses', items: all('cross').sort(byDateDesc).map(c => [c.id, crossTitle(c) + (c.date ? `, ${fmtDate(c.date)}` : '')]) }];

function formData(form) {
  const o = {};
  for (const el of form.elements) {
    if (!el.name || el.type === 'radio') continue;
    o[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim();
  }
  return o;
}
const photoField = (label = 'Photos') => `<div class="fld"><span>${label}</span><div class="ph-grid" data-phs></div><div class="actions" style="margin:8px 0 0"><button type="button" class="btn" data-ph="cam">${ic('camera')}Camera</button><button type="button" class="btn" data-ph="lib">${ic('image')}Gallery</button></div></div>`;
function mountPhotos(root, ids) {
  const st = { ids: [...(ids || [])] };
  const grid = $('[data-phs]', root);
  if (!grid) return st;
  const draw = st.draw = () => { grid.innerHTML = st.ids.map(id => `<div class="ph-t"><img data-photo="${id}" alt=""><button type="button" class="ph-x" data-rmph="${id}" aria-label="Remove photo">${ic('x')}</button></div>`).join(''); hydrate(grid); };
  draw();
  root.addEventListener('click', async e => {
    const b = e.target.closest('[data-ph]');
    if (b) {
      const files = await pickFiles(b.dataset.ph === 'cam');
      busy(true);
      try { for (const f of files) st.ids.push(await addPhoto(f)); } catch (err) { toast(err.message); } finally { busy(false); }
      draw(); return;
    }
    const r = e.target.closest('[data-rmph]');
    if (r) { st.ids = st.ids.filter(x => x !== r.dataset.rmph); draw(); }
  });
  return st;
}
function formSheet(titleText, inner, { onSave, onDelete, saveLabel = 'Save' }) {
  const el = sheet(titleText, `<form class="frm" novalidate>${inner}<div class="actions sheet-actions"><button type="submit" class="btn primary">${saveLabel}</button>${onDelete ? '<button type="button" class="btn danger" data-del>Delete</button>' : ''}</div></form>`);
  const form = $('form', el);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    try { await onSave(formData(form), form, el); } catch (err) { console.warn(err.message); toast(err.message || 'That could not be saved'); }
  });
  if (onDelete) $('[data-del]', el).addEventListener('click', async () => {
    if (!confirm('Move this to the recycle bin? Its notes and records go with it. You can restore it for 30 days.' + syncNote())) return;
    const to = await onDelete(); closeSheet(); toast('Moved to the recycle bin');
    if (to && location.hash !== to) location.hash = to; else render();
  });
  return { el, form };
}
const isNew = (id) => !id;
function afterSave(rec, wasNew, msg) {
  closeSheet(); toast(msg || (wasNew ? 'Added' : 'Saved'));
  const to = link(rec);
  if (wasNew && rec.type !== 'note' && location.hash !== to) location.hash = to; else render();
}

/* ---------- Record forms ---------- */
const gate = (cond, html) => (cond ? html : `<div hidden>${html}</div>`);
const more = (html, open) => (levelN() >= 3 || open ? html : `<details class="more"><summary>More details</summary>${html}</details>`);
function nameCode(strainId, kind, exceptId) {
  const s = get(strainId); const base = (s ? s.name : kind === 'animal' ? 'Animal' : 'Plant').replace(/\s+/g, ' ').slice(0, 28);
  const codes = new Set(all('individual').filter(i => i.id !== exceptId).map(i => (i.code || '').toLowerCase()));
  let n = 1; while (codes.has(`${base} ${n}`.toLowerCase())) n++; return `${base} ${n}`;
}
function strainSheet({ id, preset = {} } = {}) {
  const s = id ? get(id) : { kind: 'plant', ...preset };
  let ph;
  const { el } = formSheet(id ? 'Edit variety or breed' : 'New variety or breed', `
    ${F.text('name', 'Name', s.name, 'e.g. Black Futsu, Australorp')}
    <div class="two">${F.select('kind', 'Plant or animal', s.kind || 'plant', [['plant', 'Plant'], ['animal', 'Animal']])}${F.text('group', 'Group', s.group, 'Pumpkin, Herb, Chicken')}</div>
    ${F.text('species', 'Species (scientific name)', s.species, 'e.g. Cucurbita moschata')}
    ${F.check('hybrid', 'F1 hybrid (seed saved from it won\'t grow true)', s.hybrid ?? /\bf1\b/i.test(s.name || ''))}
    ${more(F.check('speciesVerified', 'Species confirmed from the packet, breeder or registry', s.speciesVerified))}
    ${F.text('origin', 'Breeder or source', s.origin)}
    ${F.area('description', 'Description', s.description, 'What it is and why you keep it')}
    ${photoField()}`, {
    onSave: async d => {
      if (!d.name) throw new Error('Add a name first');
      if (!id) {
        const exact = all('strain').find(x => x.name.toLowerCase() === d.name.toLowerCase());
        const dup = exact ? { action: 'same', strain: exact } : await checkDuplicateStrain(d.name, d.origin);
        if (dup.action === 'cancel') return;

        d.name = dup.name;

      Object.assign(rec, d, { photoIds: ph.ids });
      await save(rec); afterSave(rec, isNew(id), id ? 'Saved' : 'Added to library');

    onDelete: id && (async () => { await removeRec(id); return '#/library'; }),

const LABEL_PROMPT = `This photo shows a seed packet or a label for breeding stock (plants or animals).
Read it and reply with ONLY a JSON object, no other text, using exactly these keys:
{"name": "variety or breed name as printed",
 "kind": "plant" or "animal",
 "group": "common crop or animal type, e.g. Pumpkin, Tomato, Herb, Chicken",
 "species": "scientific name if printed, otherwise your best identification, otherwise empty",
 "speciesPrinted": true if the scientific name is printed on the label, else false,
 "origin": "seller, breeder or supplier",
 "batch": "batch or lot number",
 "year": "packed, harvest or purchase year",
 "bestBefore": "best-before or sow-by date as YYYY-MM, otherwise empty",
 "notes": "one or two short sentences of useful printed details such as days to maturity, growth habit or traits"}
Use an empty string for anything you cannot read.`;

function parseJSON(text) {
  const m = String(text || '').match(/\{[\s\S]*\}/);
  if (!m) throw new Error('The reply did not contain the expected details');
  return JSON.parse(m[0]);
}
async function callClaude(content, maxTokens = 1200) {
  const { apiKey, model } = S.settings;
  if (!apiKey) throw new Error('Add your API key in Settings');
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: model || DEFAULT_MODEL, max_tokens: maxTokens, messages: [{ role: 'user', content }] }),
    });
  } catch { throw new Error('No connection to Claude. Check your internet'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data?.error?.message || `Claude returned an error (${r.status})`); e.status = r.status; throw e; }
  return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
}
async function readLabel(photoId, opts = {}) {
  const p = await DB.get('photos', photoId);
  const b64 = (await blobToDataURL(p.full)).split(',')[1];
  return parseJSON(await callAI([{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } }, { type: 'text', text: LABEL_PROMPT }], 800, opts));
}

async function doImport(file, replace) {
  const { data, photo } = await readBackupFile(file);
  if (data.app !== 'lineage' || !Array.isArray(data.records)) throw new Error('This file is not a Lineage Tracker backup');
  // Keep a copy of the current records so this restore can be undone
  const undoAt = Date.now();
  await DB.put('meta', { key: 'undo', at: undoAt, records: [...S.recs.values()] }); S.undoAt = undoAt;
  let photos = 0;
  for (const p of data.photos || []) { const ph = await photo(p); if (ph.full) { await DB.put('photos', ph); urlCache.delete(p.id + ':t'); urlCache.delete(p.id + ':f'); photos++; } }
  const now = Date.now(), put = [];
  if (replace) {
    const keep = new Set(data.records.map(r => r.id)), batch = uid();
    for (const r of S.recs.values()) if (!keep.has(r.id) && !r.deletedAt) put.push({ ...r, deletedAt: now, delBatch: batch, delRoot: r.id, updatedAt: now });
    for (const r of data.records) r.updatedAt = now;
    for (const r of put) S.recs.set(r.id, r);
  }
  let added = 0, updated = 0, kept = 0, same = 0;
  for (const r of data.records) {
    if ((r.updatedAt || 0) > now) r.updatedAt = now;
    if ((r.createdAt || 0) > now) r.createdAt = now;
    const cur = put.some(x => x.id === r.id) ? null : S.recs.get(r.id);
    if (replace) { added += cur ? 0 : 1; updated += cur ? 1 : 0; put.push(r); continue; }
    if (!cur) added++;
    else if ((r.updatedAt || 0) > (cur.updatedAt || 0)) updated++;
    else { if ((r.updatedAt || 0) === (cur.updatedAt || 0)) same++; else kept++; continue; }
    put.push(r);
  }
  await DB.putMany('records', put);
  put.forEach(r => S.recs.set(r.id, r)); invalidateCaches();
  return [`${added} added`, `${updated} updated`, same && `${same} already up to date`, kept && `${kept} kept because this device's copy is newer`, photos && `${photos} photo${photos === 1 ? '' : 's'}`].filter(Boolean).join(', ');
}
async function undoRestore() {
  const u = await DB.get('meta', 'undo');
  if (!u) { toast('Nothing to undo'); return; }
  if (!confirm(`Put records back the way they were before the restore on ${new Date(u.at).toLocaleString()}?`)) return;
  const now = Date.now(), had = new Set(u.records.map(r => r.id)), put = [];
  for (const r of S.recs.values()) if (!had.has(r.id) && !r.deletedAt) put.push({ ...r, deletedAt: now, delBatch: 'undo' + now, delRoot: r.id, updatedAt: now });
  for (const r of u.records) put.push({ ...r, updatedAt: now });
  await DB.putMany('records', put); put.forEach(r => S.recs.set(r.id, r));
  await DB.del('meta', 'undo'); S.undoAt = null; invalidateCaches();
  toast('Restore undone'); render();
}

    catch (e) { out.innerHTML = `<div class="notice warn">${h(e.message)}<div class="actions tight"><button class="btn sm" data-act="askRun">Try again</button></div></div>`; }
  },
  askCopy: async () => {
    const q = $('#askQ').value.trim(); if (!q) { toast('Type a question first'); return; }
    toast((await copyText(askPrompt(q))) ? 'Copied. Paste it into Claude or ChatGPT' : 'Copy failed on this browser');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  e.preventDefault();
  Promise.resolve(ACT[el.dataset.act](el)).catch(err => { console.error(err); toast(err.message || 'Something went wrong'); });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const lb = $('.lb'); if (lb) { lb.remove(); return; }
  closeSheet();
});

/* ---------- Router ---------- */
const PAGES = { '': pHome, library: pLibrary, strain: pStrain, lot: pLot, tagged: pTagged, ind: pInd, projects: pProjects, project: pProject, cross: pCross, log: pLog, ask: pAsk, settings: pSettings, bin: pBin, place: pPlace, due: pDue, tree: pTree, goal: pGoal, weather: pWeather, site: pSite, import: pImport, check: pCheck, plan: pPlan, labels: pLabels, planner: pPlanner, session: pSession, offers: pOffers, tray: pTray, trays: pTrays, input: pInput, farm: pFarm, products: pProducts, product: pProduct };
const TAB_OF = { '': 'home', library: 'library', strain: 'library', lot: 'library', place: 'library', tagged: 'tagged', ind: 'tagged', projects: 'projects', project: 'projects', cross: 'projects', tree: 'projects', due: 'home', goal: 'projects', weather: 'home', site: 'home', import: 'home', check: 'home', plan: 'plan', labels: 'library', planner: 'projects', session: 'projects', offers: 'home', tray: 'tagged', trays: 'tagged', input: 'library', farm: '', products: '', product: '' };
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  return { parts: path.split('/').filter(Boolean), q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
function render() {
  const { parts, q } = parseHash();
  const root = PAGES[parts[0]] ? parts[0] : '';
  const main = $('#main');
  let html;
  if (parts[0] === 'try') { history.replaceState(null, '', '#/'); tryExample(parts[1]); return; }
  if (parts[0] === 'partner') { history.replaceState(null, '', '#/'); joinPartner(q.c); return; }
  const inSetup = !S.settings.setupDone && !liveCount() && root === '';
  document.body.classList.toggle('setup-page', inSetup);
  try { html = inSetup ? pSetup(null, q) : PAGES[root](parts[1], q); } catch (e) { console.error(e); html = `<div class="notice warn">This page hit a problem: ${h(e.message)}</div>`; }
  main.innerHTML = (typeof wsBanner === 'function' && !inSetup ? wsBanner() : '') + html;
  hydrate(main);
  const fb = $('#farmBtn'); if (fb) { fb.setAttribute('aria-label', farmTitle()); fb.title = farmTitle(); fb.classList.toggle('on', root === 'farm' || root === 'products' || root === 'product'); }
  const t4 = on('projects') ? ['projects', '#/projects', 'project', 'Projects'] : on('plan') ? ['plan', '#/plan', 'cal', 'Plan'] : ['due', '#/due', 'clock', 'Due'];
  const tab4 = $('#tab4'); if (tab4 && tab4.dataset.tab !== t4[0]) { tab4.dataset.tab = t4[0]; tab4.href = t4[1]; tab4.innerHTML = ic(t4[2]) + t4[3]; }
  const tab2 = $('#tab2'); if (tab2) tab2.innerHTML = ic('library') + word('libraryTab');
  const tab3 = $('#tab3'); if (tab3) tab3.innerHTML = ic('tag') + word('taggedTab');
  const tab = root === 'due' && t4[0] === 'due' ? 'due' : TAB_OF[root];
  $$('.tabs a').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#backBtn').hidden = !parts[1] && !['log', 'ask', 'settings', 'bin', 'due', 'weather', 'import', 'check', 'labels', 'planner', 'offers', 'trays', 'farm', 'products'].includes(root) && !(root === 'plan' && !on('projects'));
  document.body.classList.toggle('tree-page', root === 'tree');
  document.title = root ? `${(main.querySelector('h1')?.textContent || 'Lineage Tracker').trim()} | Lineage Tracker` : 'Lineage Tracker';
  mountPage(root, parts);
}
function mountPage(root, parts = []) {
  if (root === 'site') mountSite(parts[1]);
  if (root === 'check') mountCheck();
  if (root === 'labels') mountLabels();
  if (root === 'import') mountImport();
  const main = $('#main');
  const filter = $('input[data-filter]', main);
  if (filter) filter.addEventListener('input', () => {
    const t = filter.value.toLowerCase().trim();
    $$('[data-s]', main).forEach(el => { el.hidden = !!t && !el.dataset.s.includes(t); });
    $$('[data-grp]', main).forEach(g => { g.hidden = !$$('[data-s]:not([hidden])', g).length; });
  });
  if (root === 'tree') mountTree();
  if (root === 'settings') {
    mountSyncSettings();
    mountModeSettings();
    mountOffersSettings();
    $('#youForm')?.addEventListener('change', async e => { S.settings[e.target.name] = e.target.value.trim ? e.target.value.trim() : e.target.value; await saveSettings(); toast('Saved'); if (e.target.name === 'units') render(); });
    $('#ccForm')?.addEventListener('submit', async e => { e.preventDefault(); const v = e.target.elements.crossFormat.value.trim() || '{YY}C-{N}'; if (!/\{N\}/i.test(v)) { toast('Include {N} for the number'); return; } S.settings.crossFormat = v; await saveSettings(); toast('Saved'); render(); });
    $('#ccForm')?.addEventListener('input', e => { if (e.target.name === 'crossFormat' && /\{N\}/i.test(e.target.value)) $('#ccNext').textContent = crossCodeFor(today(), e.target.value); });
    $('#shareForm')?.addEventListener('change', async e => { S.settings.shareCredit = e.target.checked; await saveSettings(); toast('Saved'); });
    $('#dueForm').addEventListener('submit', async e => {
      e.preventDefault();
      const d = formData(e.target);
      const n = (v, def, min, max) => { const x = parseInt(v, 10); return isFinite(x) ? Math.max(min, Math.min(max, x)) : def; };
      Object.assign(S.settings, { fruitSetDays: n(d.fruitSetDays, 10, 1, 60), storageDays: n(d.storageDays, 30, 1, 365), germThreshold: n(d.germThreshold, 75, 1, 100), germRetestMonths: n(d.germRetestMonths, 12, 1, 120), calendar: !!d.calendar });
      await saveSettings(); toast('Saved'); render();
    });
    (async () => {
      const el = $('#storeInfo'); if (!el) return;
      try {
        const persisted = await navigator.storage?.persisted?.();
        const est = await navigator.storage?.estimate?.();
        const used = est?.usage ? `${(est.usage / 1048576).toFixed(1)} MB used on this device. ` : '';
        el.textContent = used + (persisted ? 'The browser has agreed not to clear this data on its own.' : 'The browser may clear this data if the device runs low on space, which is another reason to keep backups. Installing Lineage Tracker to your home screen usually changes this.');
      } catch {}
    })();
    $('#themeSel').addEventListener('change', async e => { S.settings.theme = e.target.value; applyTheme(); await saveSettings(); });
    const f = $('#aiForm');
    f.addEventListener('change', e => { if (e.target.name === 'ai') { $('#apiFields').hidden = e.target.value !== 'api'; $('#geminiFields').hidden = e.target.value !== 'gemini'; $('#testBtn').hidden = !['api', 'gemini'].includes(e.target.value); } });
    f.addEventListener('submit', async e => {
      e.preventDefault();
      S.settings.ai = f.querySelector('input[name=ai]:checked')?.value || 'off';
      S.settings.apiKey = f.elements.apiKey.value.trim();
      S.settings.model = f.elements.model.value.trim() || DEFAULT_MODEL;
      S.settings.geminiKey = f.elements.geminiKey.value.trim(); S.settings.geminiModel = f.elements.geminiModel.value.trim() || DEFAULT_GEMINI;
      await saveSettings(); toast('Settings saved');
    });
  }
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

/* ---------- Start ---------- */
async function init() {
  $('#backBtn').innerHTML = ic('back');
  $('#logBtn').innerHTML = ic('log');
  $('#farmBtn').innerHTML = ic('farm');
  $('#setBtn').innerHTML = ic('gear');
  $('.tabs .cap').innerHTML = ic('plus');
  for (const [tab, icon, label] of [['home', 'home', 'Home'], ['library', 'library', 'Library'], ['tagged', 'tag', 'Tagged'], ['projects', 'project', 'Projects']]) $(`.tabs a[data-tab="${tab}"]`).innerHTML = ic(icon) + label;
  try { await DB.open(); await loadWeatherCache(); }
  catch {
    $('#main').innerHTML = '<div class="notice warn">This browser blocked local storage, so Lineage Tracker can\'t save records here. Try Chrome, Edge or Firefox, or open Lineage Tracker from a web address instead of a file.</div>';
    return;
  }
  const [recs, meta] = [await DB.all('records'), await DB.mainGet('meta', 'settings')];
  recs.forEach(r => S.recs.set(r.id, r));
  if (meta) { const { key, ...rest } = meta; Object.assign(S.settings, rest); }
  S.undoAt = (await DB.get('meta', 'undo'))?.at || null;
  S.dueState = (await DB.get('meta', 'dueState'))?.state || {};
  { const li = await DB.get('meta', 'lastImport'); if (li) { const { key, ...rest } = li; S.lastImport = rest; } }
  const migrate = [];
  for (const r of S.recs.values()) if (r.type === 'stock' && r.qty == null && r.quantity) { const q = parseQty(r.quantity); if (q) { r.qty = q.qty; r.unit = r.unit || q.unit; delete r.quantity; migrate.push(r); } }
  migrate.push(...migrateGoals());
  if (!S.settings.setupDone && S.recs.size) { S.settings.setupDone = true; S.settings.level = S.settings.level || 'breeder'; S.settings.keeps = S.settings.keeps || 'both'; await saveSettings(); }
  if (migrate.length) await DB.putMany('records', migrate);
  applyTheme();
  lastPath = location.hash.split('?')[0];
  render();
  await runWsPending();
  applyPartnerTheme(); checkPartnerWithdrawn();
  maybeWhatsNew(); ensureLotCodes(); maybeDonatePrompt();
  purgeOldBin().catch(() => {});
  initSync().then(() => { if (parseHash().parts[0] === 'settings') render(); }).catch(e => console.error(e));
  navigator.storage?.persist?.().catch(() => {});
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
let lastPath = '';
window.addEventListener('hashchange', () => {
  closeSheet(); $('.lb')?.remove(); render();
  const path = location.hash.split('?')[0];
  if (path !== lastPath) window.scrollTo(0, 0);
  lastPath = path;
});
window.addEventListener('unhandledrejection', e => { if (/read-only/.test(e.reason?.message || '')) { toast(e.reason.message); e.preventDefault(); } });
init();
</script>
