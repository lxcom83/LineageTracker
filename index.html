/* ---------- Router ---------- */
const PAGES = { '': pHome, library: pLibrary, strain: pStrain, lot: pLot, tagged: pTagged, ind: pInd, projects: pProjects, project: pProject, bplan: pBplan, cross: pCross, log: pLog, ask: pAsk, settings: pSettings, bin: pBin, place: pPlace, due: pDue, tree: pTree, goal: pGoal, weather: pWeather, site: pSite, import: pImport, check: pCheck, plan: pPlan, labels: pLabels, planner: pPlanner, session: pSession, offers: pOffers, tray: pTray, trays: pTrays, input: pInput, farm: pFarm, products: pProducts, product: pProduct, genetics: pGenetics, lists: pLists, list: pList, received: pReceived, trial: pTrial, conflicts: pConflicts };
const TAB_OF = { '': 'home', library: 'library', strain: 'library', lot: 'library', place: 'library', tagged: 'tagged', ind: 'tagged', projects: 'projects', project: 'projects', bplan: 'projects', cross: 'projects', tree: 'projects', due: 'home', goal: 'projects', weather: 'home', site: 'home', import: 'home', check: 'home', plan: 'plan', labels: 'library', planner: 'projects', session: 'projects', offers: 'home', tray: 'tagged', trays: 'tagged', input: 'library', farm: '', products: '', product: '', genetics: 'projects', lists: '', list: '', received: '', trial: '', conflicts: '' };
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  return { parts: path.split('/').filter(Boolean), q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
function render() {
  const { parts, q } = parseHash();
  const root = PAGES[parts[0]] ? parts[0] : '';
  const main = $('#main');
  let html;
  if (parts[0] === 'try') { history.replaceState(null, '', '#/'); tryExample(parts[1]); return; }
  if (parts[0] === 'partner') { history.replaceState(null, '', '#/'); joinPartner(q.c); return; }
  const inSetup = !S.settings.setupDone && !liveCount() && root === '';
  document.body.classList.toggle('setup-page', inSetup);
  try { html = inSetup ? pSetup(null, q) : PAGES[root](parts[1], q); } catch (e) { console.error(e); html = `<div class="notice warn">This page hit a problem: ${h(e.message)}</div>`; }
  main.innerHTML = (typeof wsBanner === 'function' && !inSetup ? wsBanner() : '') + html;
  hydrate(main);
  $('#listsBtn')?.classList.toggle('on', ['lists', 'list', 'received'].includes(root));
  const fb = $('#farmBtn'); if (fb) { fb.setAttribute('aria-label', farmTitle()); fb.title = farmTitle(); fb.classList.toggle('on', root === 'farm' || root === 'products' || root === 'product'); }
  const t4 = on('projects') ? ['projects', '#/projects', 'project', 'Projects'] : on('plan') ? ['plan', '#/plan', 'cal', 'Plan'] : ['due', '#/due', 'clock', 'Due'];
  const tab4 = $('#tab4'); if (tab4 && tab4.dataset.tab !== t4[0]) { tab4.dataset.tab = t4[0]; tab4.href = t4[1]; tab4.innerHTML = ic(t4[2]) + t4[3]; }
  const tab2 = $('#tab2'); if (tab2) tab2.innerHTML = ic('library') + word('libraryTab');
  const tab3 = $('#tab3'); if (tab3) tab3.innerHTML = ic('tag') + word('taggedTab');
  const tab = root === 'due' && t4[0] === 'due' ? 'due' : TAB_OF[root];
  $$('.tabs a').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#backBtn').hidden = !parts[1] && !['log', 'ask', 'settings', 'bin', 'due', 'weather', 'import', 'check', 'labels', 'planner', 'offers', 'trays', 'farm', 'products', 'lists', 'conflicts'].includes(root) && !(root === 'plan' && !on('projects'));
  document.body.classList.toggle('tree-page', root === 'tree');
  document.body.classList.toggle('plan-page', root === 'bplan');
  if (root !== 'bplan') $('#planBar')?.remove();
  document.title = root ? `${(main.querySelector('h1')?.textContent || 'Lineage Tracker').trim()} | Lineage Tracker` : 'Lineage Tracker';
  mountPage(root, parts);
}
function mountPage(root, parts = []) {
  if (root === 'site') mountSite(parts[1]);
  if (root === 'conflicts') mountConflicts();
  if (root === 'trial') mountTrial(parts[1]);
  if (root === 'genetics') mountGenetics();
  { const sb = syncPausedHTML(); if (sb) $('#main').insertAdjacentHTML('afterbegin', sb); }
  ensureLotCodes(); ensureRegions();
  if (root === 'check') mountCheck();
  if (root === 'labels') mountLabels();
  if (root === 'import') mountImport();
  const main = $('#main');
  const filter = $('input[data-filter]', main);
  if (filter) filter.addEventListener('input', () => {
    const t = filter.value.toLowerCase().trim();
    $$('[data-s]', main).forEach(el => { el.hidden = !!t && !el.dataset.s.includes(t); });
    $$('[data-grp]', main).forEach(g => { g.hidden = !$$('[data-s]:not([hidden])', g).length; });
    const os = openSet(); $$('details.gdet', main).forEach(d => { d.dataset.searching = '1'; d.open = t ? true : os.has(d.dataset.gkey); delete d.dataset.searching; });
  });
  if (root === 'tree') mountTree();
  if (root === 'bplan') mountPlan(parts[1]);
  if (root === 'settings') {
    mountSyncSettings();
    mountModeSettings();
    mountOffersSettings(); mountGroupSettings();
    $('#bcForm')?.addEventListener('change', async e => { const v = String(e.target.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); const pr = get('profile'); if (pr) { pr.breederCode = v; await save(pr); } e.target.value = breederCode(); toast('Saved'); });
    $('#youForm')?.addEventListener('change', async e => { S.settings[e.target.name] = e.target.value.trim ? e.target.value.trim() : e.target.value; await saveSettings(); toast('Saved'); if (e.target.name === 'units') render(); });
    $('#ccForm')?.addEventListener('submit', async e => { e.preventDefault(); const v = e.target.elements.crossFormat.value.trim() || '{YY}C-{N}'; if (!/\{N\}/i.test(v)) { toast('Include {N} for the number'); return; } S.settings.crossFormat = v; await saveSettings(); toast('Saved'); render(); });
    $('#ccForm')?.addEventListener('input', e => { if (e.target.name === 'crossFormat' && /\{N\}/i.test(e.target.value)) $('#ccNext').textContent = crossCodeFor(today(), e.target.value); });

      S.settings.geminiKey = f.elements.geminiKey.value.trim(); S.settings.geminiModel = f.elements.geminiModel.value.trim() || DEFAULT_GEMINI;
      await saveSettings(); toast('Settings saved');
    });
  }
}

  try { await DB.open(); await loadWeatherCache(); }

    return;

  const [recs, meta] = [await DB.all('records'), await DB.mainGet('meta', 'settings')];

  { const li = await DB.get('meta', 'lastImport'); if (li) { const { key, ...rest } = li; S.lastImport = rest; } }
  const migrate = [];
  for (const r of S.recs.values()) if (r.type === 'stock' && r.qty == null && r.quantity) { const q = parseQty(r.quantity); if (q) { r.qty = q.qty; r.unit = r.unit || q.unit; delete r.quantity; migrate.push(r); } }
  migrate.push(...migrateGoals());

  if (migrate.length) await DB.putMany('records', migrate);

  maybeWhatsNew(); ensureLotCodes(); maybeDonatePrompt();
  purgeOldBin().catch(() => {});

init();
